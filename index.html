<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GJM File Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="File Hub">
<style>
:root{
  --bg:#0b1f3a; --bg2:#0e2748; --surface:#122c52; --surface2:#183560;
  --text:#eaf1ff; --text-dim:#9db3d6; --accent:#2f8fe0; --accent2:#3fd0e0;
  --danger:#e35d5d; --ok:#3ecf8e; --border:#20406f; --shadow:0 8px 24px rgba(0,0,0,.35);
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3fb; --bg2:#e4ecf9; --surface:#ffffff; --surface2:#f3f7ff;
    --text:#0b1f3a; --text-dim:#5b6c8a; --border:#d7e2f5; --shadow:0 8px 20px rgba(20,40,80,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1f3a; --bg2:#0e2748; --surface:#122c52; --surface2:#183560;
  --text:#eaf1ff; --text-dim:#9db3d6; --border:#20406f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
button{font-family:inherit;}
.hidden{display:none !important;}
img{max-width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- Top bar ---------- */
#topbar{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:var(--bg2); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
}
#topbar .back{
  background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
#topbar .back:hover{background:var(--surface2);}
#topbar h1{font-size:16px;margin:0;flex:1;font-weight:600;letter-spacing:.2px;}
#topbar .logo-mini{width:28px;height:28px;border-radius:8px;object-fit:cover;}
#topbar .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--border);}

/* ---------- Layout ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:0;}
.view{flex:1;overflow-y:auto;padding:16px;padding-bottom:140px;}
.container{max-width:760px;margin:0 auto;width:100%;}

/* ---------- Lock / login ---------- */
#lockscreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 30% 20%, var(--bg2), var(--bg) 70%); padding:24px; gap:18px;
}
.lock-card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:28px 24px; width:100%; max-width:360px; box-shadow:var(--shadow); text-align:center;
}
.lock-logo{width:96px;height:96px;border-radius:22px;object-fit:cover;margin:0 auto 14px;display:block;box-shadow:var(--shadow);}
.lock-card h2{margin:0 0 4px;font-size:20px;}
.lock-card p{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:14px; outline:none;
}
.field input:focus{border-color:var(--accent);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent); color:#fff; border:none; padding:11px 18px; border-radius:10px;
  font-size:14px; font-weight:600; cursor:pointer; width:100%;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:var(--danger);}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn.small{padding:7px 12px;font-size:12.5px;width:auto;}
.err{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:6px;}
.msg-ok{color:var(--ok);font-size:12.5px;}

/* ---------- Home grid ---------- */
.hero{
  background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border); border-radius:20px; padding:22px; display:flex; align-items:center; gap:16px;
  margin-bottom:18px; box-shadow:var(--shadow);
}
.hero img{width:56px;height:56px;border-radius:14px;object-fit:cover;}
.hero .t{flex:1;min-width:0;}
.hero h2{margin:0 0 2px;font-size:17px;}
.hero p{margin:0;color:var(--text-dim);font-size:12.5px;}
.menu-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
}
@media(min-width:520px){ .menu-grid{grid-template-columns:repeat(4,1fr);} }
.menu-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:18px 10px; text-align:center; cursor:pointer; transition:transform .12s, border-color .12s;
}
.menu-card:hover{border-color:var(--accent); transform:translateY(-2px);}
.menu-card .ic{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 8px; font-size:22px;
}
.menu-card .lbl{font-size:12.5px;font-weight:600;}
.menu-card .sub{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

/* ---------- Section header ---------- */
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.section-title h2{margin:0;font-size:18px;}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.folder-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--border);padding:8px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.folder-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}

.item-list{display:flex;flex-direction:column;gap:8px;}
.item-row{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:10px 12px;cursor:pointer;
}
.item-row:hover{border-color:var(--accent);}
.item-row .thumb{
  width:42px;height:42px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;object-fit:cover;
}
.item-row .meta{flex:1;min-width:0;}
.item-row .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-row .sub{font-size:11px;color:var(--text-dim);}
.item-row .del{
  background:none;border:none;color:var(--danger);font-size:17px;cursor:pointer;padding:6px;flex-shrink:0;
}
.empty-state{text-align:center;padding:50px 16px;color:var(--text-dim);}
.empty-state .ic{font-size:36px;margin-bottom:10px;}

/* photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-grid .ph{
  aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);position:relative;cursor:pointer;
  border:1px solid var(--border);
}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;}
.photo-grid .ph .del{
  position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;
  width:24px;height:24px;font-size:13px;cursor:pointer;
}

/* upload zone */
.upload-zone{
  border:2px dashed var(--border); border-radius:14px; padding:22px; text-align:center;
  color:var(--text-dim); font-size:13px; margin-bottom:14px; cursor:pointer;
}
.upload-zone:hover{border-color:var(--accent);color:var(--text);}

/* player */
.player-bar{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:60;
}
.player-bar .pinfo{flex:1;min-width:0;}
.player-bar .pname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-bar audio{width:100%;height:32px;}
.player-bar .pclose{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;}
.pctrl{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.pbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.pbtn:hover{border-color:var(--accent);}
.pbtn.mode{width:auto;border-radius:19px;padding:0 12px;font-size:12px;font-weight:600;gap:5px;white-space:nowrap;}
.vctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
@media(max-width:520px){
  .player-bar{flex-wrap:wrap;}
  .player-bar .pinfo{flex-basis:100%;order:1;}
  .player-bar .pctrl{order:2;flex:1;justify-content:center;}
  .player-bar .pclose{order:3;}
}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(6,14,28,.72);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:18px;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;
  max-height:88vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow);
}
.modal h3{margin:0 0 12px;font-size:16px;}
.modal .close-x{float:right;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
.viewer-modal .modal{max-width:92vw;max-height:92vh;padding:10px;}
.viewer-modal img, .viewer-modal video{width:100%;max-height:78vh;object-fit:contain;border-radius:10px;}
.viewer-modal iframe{width:100%;height:78vh;border:none;border-radius:10px;background:#fff;}

/* nav */
.quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.qlink{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 6px;text-align:center;
  cursor:pointer;font-size:12px;font-weight:600;
}
.qlink .ic{font-size:20px;display:block;margin-bottom:6px;}
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;}

/* options */
.opt-block{
  background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px;
}
.opt-block h3{margin:0 0 12px;font-size:14.5px;}
.avatar-pick{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.avatar-pick img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--border);}

/* toast */
#toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--surface2);
  border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:20px;font-size:13px;
  z-index:200;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;
}
#toast.show{opacity:1;}

.tag-note{
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;
  font-size:12px;color:var(--text-dim);margin-bottom:14px;line-height:1.5;
}
.conv-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:560px){.conv-grid{grid-template-columns:1fr 1fr;}}
.conv-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;}
.conv-card h4{margin:0 0 6px;font-size:13.5px;}
.conv-card p{margin:0 0 12px;font-size:11.5px;color:var(--text-dim);}

.sync-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;}
.dot.off{background:var(--text-dim);}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

/* ============================================================
   GJM FILE HUB — application container multimédia GJM Technologie
   ============================================================ */

let claudeDownloads = null;
let idb = null;
let deferredInstallPrompt = null;
const APP_VERSION = '1.3 · 14/10/2026 · lecteur enchaîné + écran verrouillé + fenêtre flottante';
let state = {
  settings: { appName:"GJM File Hub", ownerName:"", username:"", passwordHash:"" },
  avatarURL: null,
  media: [],      // {id,type,name,blob,url,folderId,size,addedAt}
  folders: [],    // {id,type,name,createdAt}
  unlocked: false,
  currentType: null,
  currentFolder: null,
  history: []
};

/* ---------------- Stockage local (IndexedDB) — indépendant à chaque appareil ---------------- */
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('gjmFileHubDB', 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media', {keyPath:'id'});
      if(!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', {keyPath:'id'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
      if(!db.objectStoreNames.contains('avatar')) db.createObjectStore('avatar', {keyPath:'key'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbStore(name, mode){ return idb.transaction(name, mode).objectStore(name); }
function idbGetAll(name){
  return new Promise((res,rej)=>{ const r = idbStore(name,'readonly').getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function idbGet(name, key){
  return new Promise((res,rej)=>{ const r = idbStore(name,'readonly').get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function idbPut(name, value){
  return new Promise((res,rej)=>{ const r = idbStore(name,'readwrite').put(value); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
function idbDelete(name, key){
  return new Promise((res,rej)=>{ const r = idbStore(name,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
function idbClearAll(){
  return new Promise((res,rej)=>{
    const tx = idb.transaction(['media','folders','settings','avatar'], 'readwrite');
    ['media','folders','settings','avatar'].forEach(s=>tx.objectStore(s).clear());
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- Boot ---------------- */
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  const lv = document.getElementById('lock-version'); if(lv) lv.textContent = 'Version ' + APP_VERSION.split(' · ')[0];
  document.getElementById('lock-submit').addEventListener('click', tryLogin);
  document.getElementById('lock-forgot').addEventListener('click', forgotLogin);
  document.getElementById('lock-eye').addEventListener('click', ()=>{
    const p = document.getElementById('lock-pass');
    p.type = p.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('lock-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  document.getElementById('btn-back').addEventListener('click', ()=>navBack());
  document.getElementById('player-close').addEventListener('click', closePlayer);
  document.getElementById('p-prev').addEventListener('click', ()=>stepAudio(-1));
  document.getElementById('p-next').addEventListener('click', ()=>stepAudio(1));
  document.getElementById('p-mode').addEventListener('click', ()=>cycleMode('audio'));
  document.getElementById('player-audio').addEventListener('ended', ()=>onMediaEnded('audio'));
  attachSessionListeners(document.getElementById('player-audio'), 'audio');

  try{
    claudeDownloads = await claude.use('downloads');
  }catch(e){ claudeDownloads = null; }

  try{
    idb = await idbOpen();
  }catch(e){
    idb = null;
    toast("Le stockage local n'est pas disponible sur ce navigateur.");
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    document.querySelectorAll('.install-btn').forEach(b=>b.classList.remove('hidden'));
  });
  window.addEventListener('appinstalled', ()=>{
    deferredInstallPrompt = null;
    document.querySelectorAll('.install-btn').forEach(b=>b.classList.add('hidden'));
    toast("Application installée ✅");
  });

  await loadSettings();
  await loadMediaAndFolders();
  applyBranding();

  if(state.settings.passwordHash){
    showLock();
  } else {
    unlockApp();
  }
}

/* ---------------- Settings / stockage local ---------------- */
async function loadSettings(){
  if(!idb) return;
  try{
    const row = await idbGet('settings', 'app');
    if(row) state.settings = Object.assign(state.settings, row);
  }catch(e){ /* pas encore de réglages */ }
  try{
    const av = await idbGet('avatar', 'app');
    if(av && av.blob) state.avatarURL = URL.createObjectURL(av.blob);
  }catch(e){ /* pas de photo */ }
}

async function saveSettings(patch){
  state.settings = Object.assign(state.settings, patch);
  applyBranding();
  if(!idb){ toast("Stockage local indisponible sur ce navigateur"); return; }
  try{
    await idbPut('settings', Object.assign({key:'app'}, state.settings));
  }catch(e){ console.error(e); }
}

async function loadMediaAndFolders(){
  if(!idb) return;
  try{
    const rows = await idbGetAll('media');
    state.media = rows.map(m=>Object.assign({}, m, {url: URL.createObjectURL(m.blob)}));
  }catch(e){ console.error(e); }
  try{
    state.folders = await idbGetAll('folders');
  }catch(e){ console.error(e); }
}

function applyBranding(){
  const name = state.settings.appName || "GJM File Hub";
  document.title = name;
  document.getElementById('lock-appname').textContent = name;
  document.getElementById('topbar-title').textContent = name;
  const av = document.getElementById('topbar-avatar');
  if(state.avatarURL){
    av.src = state.avatarURL;
    av.classList.remove('hidden');
  } else {
    av.classList.add('hidden');
  }
}

/* ---------------- Lock screen ---------------- */
function showLock(){
  document.getElementById('lockscreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function tryLogin(){
  const u = document.getElementById('lock-user').value.trim();
  const p = document.getElementById('lock-pass').value;
  const err = document.getElementById('lock-err');
  err.textContent = '';
  if(!u || !p){ err.textContent = "Renseignez votre identifiant et mot de passe."; return; }
  const hash = await sha256(p);
  const hashTrim = await sha256(p.trim());
  const userOk = u.toLowerCase() === (state.settings.username||'').trim().toLowerCase();
  const passOk = hash === state.settings.passwordHash || hashTrim === state.settings.passwordHash;
  if(userOk && passOk){
    unlockApp();
  } else {
    err.textContent = "Identifiant ou mot de passe incorrect.";
  }
}

function forgotLogin(){
  openModal(`
    <h3>Identifiant ou mot de passe oublié ?</h3>
    <p style="color:var(--text-dim);font-size:13px;">Par sécurité, il n'est pas possible de retrouver le mot de passe. Vous pouvez réinitialiser l'application <b>sur cet appareil</b> : le verrouillage est supprimé, mais <b>tous les fichiers, dossiers et réglages enregistrés ici sont effacés</b>. Les autres appareils ne sont pas touchés.</p>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn secondary" id="cancel-reset">Annuler</button>
      <button class="btn danger" id="do-reset">Réinitialiser</button>
    </div>
  `);
  document.getElementById('cancel-reset').onclick = closeModal;
  document.getElementById('do-reset').onclick = async ()=>{
    closeModal();
    if(idb){ try{ await idbClearAll(); }catch(e){} }
    state.media.forEach(m=>{ if(m.url) URL.revokeObjectURL(m.url); });
    state.media = []; state.folders = [];
    state.settings = { appName:"GJM File Hub", ownerName:"", username:"", passwordHash:"" };
    state.avatarURL = null;
    closePlayer();
    applyBranding();
    unlockApp();
    toast("Application réinitialisée");
  };
}
function unlockApp(){
  state.unlocked = true;
  document.getElementById('lockscreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  goHome();
}
function lockApp(){
  closePlayer();
  state.unlocked = false;
  document.getElementById('lock-pass').value = '';
  showLock();
}

/* ---------------- Navigation ---------------- */
function navTo(view, opts){
  state.history.push({view: state.currentView, opts: state.currentOpts});
  document.getElementById('btn-back').classList.remove('hidden');
  document.getElementById('topbar-logo').classList.add('hidden');
  renderView(view, opts);
}
function navBack(){
  const prev = state.history.pop();
  if(!prev || !prev.view){ goHome(); return; }
  renderView(prev.view, prev.opts, true);
}
function goHome(){
  state.history = [];
  document.getElementById('btn-back').classList.add('hidden');
  document.getElementById('topbar-logo').classList.remove('hidden');
  renderView('home');
}
function renderCurrentView(){
  if(state.currentView) renderView(state.currentView, state.currentOpts, true, true);
}

function renderView(view, opts, skipHistory, keepPlayer){
  state.currentView = view;
  state.currentOpts = opts || {};
  const el = document.getElementById('view-inner');
  el.innerHTML = '';
  const renderers = {
    home: renderHome, library: renderLibrary, nav: renderNav,
    storage: renderStorage, convert: renderConvert, options: renderOptions
  };
  (renderers[view] || renderHome)(el, opts||{});
  document.getElementById('view').scrollTop = 0;
}

    <div class="menu-grid" id="menu-grid"></div>
    <button class="btn install-btn hidden" id="install-btn-home" style="margin-top:16px;">📲 Installer l'application</button>
  `;
  const grid = document.getElementById('menu-grid');
  MENU.forEach(m=>{
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.innerHTML = `<div class="ic" style="background:${m.color}22;color:${m.color}">${m.ic}</div>

/* ---------------- LIBRARY (musique/vidéo/document/photo) ---------------- */
const TYPE_INFO = {
  audio:{label:'Musique', ic:'🎵', accept:'audio/*', empty:'Aucune musique pour le moment.'},
  video:{label:'Vidéos', ic:'🎬', accept:'video/*', empty:'Aucune vidéo pour le moment.'},
  document:{label:'Documents', ic:'📄', accept:'.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,application/pdf', empty:'Aucun document pour le moment.'},
  photo:{label:'Photos', ic:'🖼️', accept:'image/*', empty:'Aucune photo pour le moment.'},
};

function renderLibrary(el, opts){
  const type = opts.type;
  state.currentType = type;
  const info = TYPE_INFO[type];
  const folderId = opts.folderId || null;
  state.currentFolder = folderId;
  const folders = state.folders.filter(f=>f.type===type);
  const items = state.media.filter(m=>m.type===type && (m.folderId||null) === folderId);
  const currentFolder = folders.find(f=>f.id===folderId);

  el.innerHTML = `
    <div class="section-title">
      <h2>${info.ic} ${currentFolder ? escapeHtml(currentFolder.name) : info.label}</h2>
    </div>
    <div class="upload-zone" id="uz">
      📤 Touchez pour ajouter des fichiers (ou glissez-déposez sur ordinateur)
      <input type="file" id="file-input" accept="${info.accept}" multiple class="hidden">
    </div>
    <div class="actions-row">
      <button class="folder-chip" id="btn-new-folder">➕ Nouveau dossier</button>
      ${folderId ? '' : ''}
    </div>
    ${folders.length && !folderId ? `<div class="chips-row" id="folders-row"></div>` : ''}
    <div id="items-holder"></div>
  `;

  document.getElementById('uz').onclick = ()=>document.getElementById('file-input').click();
  document.getElementById('file-input').onchange = (e)=>handleUpload(e.target.files, type, folderId);
  const uz = document.getElementById('uz');
  uz.ondragover = e=>{e.preventDefault(); uz.style.borderColor='var(--accent)';};
  uz.ondragleave = ()=>{uz.style.borderColor='';};
  uz.ondrop = e=>{ e.preventDefault(); uz.style.borderColor=''; handleUpload(e.dataTransfer.files, type, folderId); };

  document.getElementById('btn-new-folder').onclick = ()=>openNewFolderModal(type);

  if(folders.length && !folderId){
    const row = document.getElementById('folders-row');
    folders.forEach(f=>{
      const chip = document.createElement('div');
      chip.className = 'folder-chip';
      chip.textContent = '📁 ' + f.name;
      chip.onclick = ()=>navTo('library', {type, folderId:f.id});
      row.appendChild(chip);
    });
  }

  const holder = document.getElementById('items-holder');
  if(!items.length){
    holder.innerHTML = `<div class="empty-state"><div class="ic">${info.ic}</div><p>${info.empty}</p></div>`;
    return;
  }

  if(type === 'photo'){
    const grid = document.createElement('div'); grid.className = 'photo-grid';
    items.forEach(it=>{
      const cell = document.createElement('div'); cell.className='ph';
      cell.innerHTML = `<img src="${it.url}" loading="lazy">
        <button class="del">✕</button>`;
      cell.querySelector('img').onclick = ()=>openViewer(it);
      cell.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); confirmDelete(it); };
      grid.appendChild(cell);
    });
    holder.appendChild(grid);
    return;
  }

  const list = document.createElement('div'); list.className = 'item-list';
  items.forEach(it=>{
    const row = document.createElement('div'); row.className='item-row';
    const thumbHtml = type==='document' ? '📄' : (type==='video' ? '🎬' : '🎵');
    row.innerHTML = `<div class="thumb">${thumbHtml}</div>
      <div class="meta"><div class="name">${escapeHtml(it.name)}</div>
      <div class="sub">${formatSize(it.size)} · ${formatDate(it.addedAt)}</div></div>
      <button class="del">✕</button>`;
    row.querySelector('.meta').onclick = ()=> type==='audio' ? playAudio(it, items) : openViewer(it, items);
    row.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); confirmDelete(it); };
    list.appendChild(row);
  });
  holder.appendChild(list);
}

async function handleUpload(fileList, type, folderId){
  if(!fileList || !fileList.length) return;
  if(!idb){ toast("Le stockage local n'est pas disponible sur ce navigateur."); return; }
  toast("Ajout en cours…");
  for(const file of Array.from(fileList)){
    try{
      const id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      const rec = {
        id, type, name:file.name, size:file.size,
        folderId: folderId||null, addedAt: Date.now(), blob:file
      };
      await idbPut('media', rec);
      state.media.push(Object.assign({}, rec, {url: URL.createObjectURL(file)}));
    }catch(e){
      console.error(e);
      toast("Échec de l'ajout de « " + file.name + " » (espace de stockage de l'appareil insuffisant ?)");
    }
  }
  renderCurrentView();
  toast("Ajout terminé");
}

function confirmDelete(item){
  openModal(`
    <h3>Supprimer ce fichier ?</h3>
    <p style="color:var(--text-dim);font-size:13px;">« ${escapeHtml(item.name)} » sera définitivement supprimé.</p>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn secondary" id="cancel-del">Annuler</button>
      <button class="btn danger" id="do-del">Supprimer</button>
    </div>
  `);
  document.getElementById('cancel-del').onclick = closeModal;
  document.getElementById('do-del').onclick = async ()=>{
    closeModal();
    try{
      if(audioState.cur && audioState.cur.id===item.id) closePlayer();
      if(idb) await idbDelete('media', item.id);
      if(item.url) URL.revokeObjectURL(item.url);
      state.media = state.media.filter(m=>m.id!==item.id);
      renderCurrentView();
      toast("Fichier supprimé");
    }catch(e){ toast("Suppression impossible"); }
  };
}

function openNewFolderModal(type){
  openModal(`
    <h3>Nouveau dossier</h3>
    <div class="field"><label>Nom du dossier</label><input id="new-folder-name" placeholder="Ex: Cantiques"></div>
    <button class="btn" id="create-folder-btn">Créer</button>
  `);
  document.getElementById('create-folder-btn').onclick = async ()=>{
    const name = document.getElementById('new-folder-name').value.trim();
    if(!name){ toast("Donnez un nom au dossier"); return; }
    const id = 'f_' + Date.now();
    const rec = {id, type, name, createdAt:Date.now()};
    if(idb){ await idbPut('folders', rec); }
    state.folders.push(rec);
    renderCurrentView();
    closeModal();
    toast("Dossier créé");
  };
}

/* ---------------- Player / Viewer ---------------- */
/* ---------------- Lecture enchaînée + modes (musique & vidéo) ---------------- */
const PLAY_MODES = [
  {id:'seq', ic:'➡️', short:'Enchaîner', label:'Enchaîner : on passe au suivant, puis on s\'arrête à la fin de la liste'},
  {id:'all', ic:'🔁', short:'Boucle liste', label:'Boucle de la liste : après le dernier, on recommence au premier'},
  {id:'one', ic:'🔂', short:'Répéter 1', label:'Répéter le même : le titre actuel se rejoue en boucle'},
];
let audioState = {queue:[], idx:0, cur:null};
let videoState = {queue:[], idx:0, cur:null};
let mediaKind = null;       // 'audio' ou 'video' : ce qui pilote les commandes de l'écran verrouillé
let lastPosSync = 0;

/* ---- Commandes système : écran verrouillé, notification, casque Bluetooth, fenêtre flottante ---- */
function activeMedia(kind){ return document.getElementById(kind==='audio' ? 'player-audio' : 'viewer-video'); }
function artworkList(){
  const img = document.querySelector('.lock-logo');
  return (img && img.src) ? [{src:img.src, sizes:'400x400', type:'image/png'}] : [];
}
function updateMediaSession(kind){
  if(!('mediaSession' in navigator)) return;
  const st = kind==='audio' ? audioState : videoState;
  if(!st.cur) return;
  mediaKind = kind;
  const ms = navigator.mediaSession;
  try{
    ms.metadata = new MediaMetadata({
      title: st.cur.name,
      artist: state.settings.appName || 'GJM File Hub',
      album: kind==='audio' ? 'Musique' : 'Vidéo',
      artwork: artworkList()
    });
  }catch(e){}
  const set = (a,f)=>{ try{ ms.setActionHandler(a,f); }catch(e){} };
  const el = ()=>activeMedia(kind);
  set('play',  ()=>{ const e=el(); if(e) e.play().catch(()=>{}); });
  set('pause', ()=>{ const e=el(); if(e) e.pause(); });
  set('previoustrack', ()=> kind==='audio' ? stepAudio(-1) : stepVideo(-1));
  set('nexttrack',     ()=> kind==='audio' ? stepAudio(1)  : stepVideo(1));
  set('seekbackward', d=>{ const e=el(); if(e) e.currentTime = Math.max(0, e.currentTime - ((d&&d.seekOffset)||10)); });
  set('seekforward',  d=>{ const e=el(); if(e) e.currentTime = Math.min(e.duration||1e9, e.currentTime + ((d&&d.seekOffset)||10)); });
  set('seekto',       d=>{ const e=el(); if(e && d && d.seekTime!=null) e.currentTime = d.seekTime; });
  // Vidéo : quand on quitte l'appli, le navigateur ouvre la fenêtre flottante tout seul
  set('enterpictureinpicture', kind==='video' ? ()=>{ const e=el(); if(e && e.requestPictureInPicture) e.requestPictureInPicture().catch(()=>{}); } : null);
  const e0 = el(); try{ ms.playbackState = (e0 && !e0.paused) ? 'playing' : 'paused'; }catch(e){}
}
function clearMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  try{ ms.metadata = null; }catch(e){}
  ['play','pause','previoustrack','nexttrack','seekbackward','seekforward','seekto','enterpictureinpicture'].forEach(a=>{ try{ ms.setActionHandler(a,null); }catch(e){} });
  try{ ms.playbackState = 'none'; }catch(e){}
  mediaKind = null;
}
function attachSessionListeners(el, kind){
  el.addEventListener('play',  ()=>{ if(mediaKind===kind){ try{ navigator.mediaSession.playbackState='playing'; }catch(e){} } });
  el.addEventListener('pause', ()=>{ if(mediaKind===kind){ try{ navigator.mediaSession.playbackState='paused'; }catch(e){} } });
  el.addEventListener('timeupdate', ()=>{
    if(mediaKind!==kind || !('mediaSession' in navigator)) return;
    const now = Date.now(); if(now-lastPosSync<1000) return; lastPosSync = now;
    if(!isFinite(el.duration) || el.duration<=0) return;
    try{ navigator.mediaSession.setPositionState({duration:el.duration, playbackRate:el.playbackRate||1, position:Math.min(el.currentTime, el.duration)}); }catch(e){}
  });
}

function getMode(kind){
  const id = state.settings[kind==='audio' ? 'modeAudio' : 'modeVideo'] || 'seq';
  return PLAY_MODES.find(m=>m.id===id) || PLAY_MODES[0];
}
function cycleMode(kind){
  const cur = getMode(kind);
  const nxt = PLAY_MODES[(PLAY_MODES.findIndex(m=>m.id===cur.id)+1) % PLAY_MODES.length];
  saveSettings({[kind==='audio' ? 'modeAudio' : 'modeVideo']: nxt.id});
  refreshModeButtons();
  toast(nxt.label);
}
function refreshModeButtons(){
  const a = getMode('audio'), v = getMode('video');
  const pb = document.getElementById('p-mode');
  if(pb){ pb.innerHTML = `<span>${a.ic}</span><span>${a.short}</span>`; pb.title = a.label; }
  const vb = document.getElementById('v-mode');
  if(vb){ vb.innerHTML = `<span>${v.ic}</span><span>${v.short}</span>`; vb.title = v.label; }
}

/* Calcule le prochain index. auto = fin naturelle du média ; sinon bouton Suivant/Précédent. */
function pickIndex(st, kind, dir, auto){
  const n = st.queue.length, mode = getMode(kind).id;
  if(auto && mode==='one') return st.idx;
  const j = st.idx + dir;
  if(j>=0 && j<n) return j;
  if(mode==='all') return dir>0 ? 0 : n-1;
  return null;
}

function playAudio(item, queue){
  const q = (queue && queue.length) ? queue : [item];
  audioState.queue = q.slice();
  audioState.idx = Math.max(0, audioState.queue.findIndex(m=>m.id===item.id));
  loadAudioCurrent();
}
function loadAudioCurrent(){
  const it = audioState.queue[audioState.idx];
  if(!it) return;
  audioState.cur = it;
  document.getElementById('player-bar').classList.remove('hidden');
  const n = audioState.queue.length;
  document.getElementById('player-name').textContent = (n>1 ? (audioState.idx+1)+'/'+n+' · ' : '') + it.name;
  const audio = document.getElementById('player-audio');
  audio.src = it.url;
  audio.play().catch(()=>{});
  refreshModeButtons();
  updateMediaSession('audio');
}
function stepAudio(dir){
  if(!audioState.queue.length) return;
  const audio = document.getElementById('player-audio');
  if(dir<0 && audio.currentTime>3){ audio.currentTime = 0; return; }
  const j = pickIndex(audioState, 'audio', dir, false);
  if(j===null){
    if(dir<0){ audio.currentTime = 0; } else toast("Fin de la liste");
    return;
  }
  audioState.idx = j; loadAudioCurrent();
}
function closePlayer(){
  document.getElementById('player-bar').classList.add('hidden');
  const audio = document.getElementById('player-audio');
  audio.pause(); audio.removeAttribute('src'); audio.load();
  audioState = {queue:[], idx:0, cur:null};
  if(mediaKind==='audio') clearMediaSession();
}

/* Fin naturelle d'un titre ou d'une vidéo */
function onMediaEnded(kind){
  const st = kind==='audio' ? audioState : videoState;
  if(!st.queue.length) return;
  const j = pickIndex(st, kind, 1, true);
  if(j===null) return; // fin de liste en mode « Enchaîner » : on s'arrête
  st.idx = j;
  if(kind==='audio'){
    if(j===st.queue.indexOf(st.cur) && getMode('audio').id==='one'){
      const a = document.getElementById('player-audio'); a.currentTime = 0; a.play().catch(()=>{});
    } else loadAudioCurrent();
  } else loadVideoCurrent();
}

/* ---- Vidéo : la fenêtre reste ouverte, on change juste la source (le plein écran est conservé) ---- */
function loadVideoCurrent(){
  const it = videoState.queue[videoState.idx];
  if(!it) return;
  const v = document.getElementById('viewer-video');
  if(!v) return;
  videoState.cur = it;
  const n = videoState.queue.length;
  const t = document.getElementById('viewer-title');
  if(t) t.textContent = (n>1 ? (videoState.idx+1)+'/'+n+' · ' : '') + it.name;
  v.src = it.url; v.play().catch(()=>{});
  const dl = document.getElementById('dl-btn');
  if(dl) dl.onclick = ()=>downloadAsset(it);
  refreshModeButtons();
  updateMediaSession('video');
}
function stepVideo(dir){
  if(!videoState.queue.length) return;
  const v = document.getElementById('viewer-video');
  if(dir<0 && v && v.currentTime>3){ v.currentTime = 0; return; }
  const j = pickIndex(videoState, 'video', dir, false);
  if(j===null){ if(dir<0 && v) v.currentTime = 0; else toast("Fin de la liste"); return; }
  videoState.idx = j; loadVideoCurrent();
}

function openViewer(item, queue){
  const url = item.url;
  let body = '';
  if(item.type === 'photo'){
    body = `<img src="${url}">`;
  } else if(item.type === 'video'){
    body = `<video id="viewer-video" src="${url}" controls autoplay playsinline></video>
      <div class="vctrl">
        <button class="pbtn" id="v-prev" title="Précédente">⏮</button>
        <button class="pbtn mode" id="v-mode" title="Changer le mode de lecture"></button>
        <button class="pbtn" id="v-next" title="Suivante">⏭</button>
        <button class="pbtn hidden" id="v-pip" title="Fenêtre flottante : la vidéo reste visible sur l'écran d'accueil">🗗</button>
      </div>`;
  } else if(item.type === 'document'){
    const lower = item.name.toLowerCase();
    if(lower.endsWith('.pdf')){
      body = `<iframe src="${url}"></iframe>`;
    } else if(lower.endsWith('.docx')){
      body = `<div id="docx-render" style="background:#fff;color:#111;padding:20px;border-radius:10px;max-height:78vh;overflow:auto;">Chargement…</div>`;
    } else if(lower.match(/\.(txt)$/)){
      body = `<iframe src="${url}"></iframe>`;
    } else {
      body = `<div class="tag-note">Aperçu non disponible pour ce type de fichier dans le navigateur. Utilisez le bouton ci-dessous pour l'enregistrer sur cet appareil et l'ouvrir avec l'application adaptée.</div>`;
    }
  }
  openModal(`
    <button class="close-x" id="close-viewer">✕</button>
    <h3 id="viewer-title">${escapeHtml(item.name)}</h3>
    ${body}
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn secondary" id="dl-btn">⬇️ Enregistrer sur cet appareil</button>
    </div>
  `, true);
  document.getElementById('close-viewer').onclick = closeModal;
  document.getElementById('dl-btn').onclick = ()=>downloadAsset(item);

  if(item.type==='video'){
    closePlayer(); // coupe la musique éventuelle pour ne pas la mélanger à la vidéo
    const q = (queue && queue.length) ? queue : [item];
    videoState = {queue:q.slice(), idx:Math.max(0,q.findIndex(m=>m.id===item.id)), cur:item};
    const v = document.getElementById('viewer-video');
    v.addEventListener('ended', ()=>{
      if(getMode('video').id==='one'){ v.currentTime = 0; v.play().catch(()=>{}); }
      else onMediaEnded('video');
    });
    document.getElementById('v-prev').onclick = ()=>stepVideo(-1);
    document.getElementById('v-next').onclick = ()=>stepVideo(1);
    document.getElementById('v-mode').onclick = ()=>cycleMode('video');
    attachSessionListeners(v, 'video');
    // Fenêtre flottante (Picture-in-Picture)
    try{ v.disablePictureInPicture = false; v.autoPictureInPicture = true; }catch(e){}
    const webkitPip = !!(v.webkitSupportsPresentationMode && v.webkitSupportsPresentationMode('picture-in-picture'));
    const stdPip = !!(document.pictureInPictureEnabled && v.requestPictureInPicture);
    const pipBtn = document.getElementById('v-pip');
    if(stdPip || webkitPip){
      pipBtn.classList.remove('hidden');
      pipBtn.onclick = async ()=>{
        try{
          if(stdPip){
            if(document.pictureInPictureElement===v) await document.exitPictureInPicture();
            else await v.requestPictureInPicture();
          } else {
            v.webkitSetPresentationMode(v.webkitPresentationMode==='picture-in-picture' ? 'inline' : 'picture-in-picture');
          }
        }catch(e){ toast("La fenêtre flottante n'est pas disponible pour cette vidéo."); }
      };
    }
    loadVideoCurrent();
  }

  if(item.type==='document' && item.name.toLowerCase().endsWith('.docx')){
    item.blob.arrayBuffer().then(buf=>{
      return mammoth.convertToHtml({arrayBuffer:buf});
    }).then(res=>{
      const t = document.getElementById('docx-render');
      if(t) t.innerHTML = res.value;
    }).catch(()=>{
      const t = document.getElementById('docx-render');
      if(t) t.textContent = "Impossible d'afficher un aperçu de ce document.";
    });
  }
}

async function downloadAsset(item){
  try{
    if(claudeDownloads){
      const arr = new Uint8Array(await item.blob.arrayBuffer());
      let bin=''; arr.forEach(b=>bin+=String.fromCharCode(b));
      await claudeDownloads.save({filename:item.name, data:btoa(bin)});
    } else {
      const a = document.createElement('a');
      a.href = item.url; a.download = item.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ toast("Échec de l'enregistrement"); }
}

/* ---------------- NAVIGATION (web) ---------------- */
function renderNav(el){
  el.innerHTML = `
    <div class="section-title"><h2>🌐 Navigation</h2></div>
    <div class="tag-note">La recherche s'ouvre dans un nouvel onglet de votre navigateur (Chrome, Safari…). Google, YouTube, Facebook ou WhatsApp interdisent volontairement à toute application de les afficher « à l'intérieur » d'elle-même (c'est une protection de sécurité qu'ils imposent à tout le monde, pas seulement à cette application) — c'est pourquoi ils s'ouvrent dans un onglet séparé plutôt que dans un cadre de l'appli.</div>
    <div class="search-bar">
      <input id="nav-input" placeholder="Rechercher un mot, un lien, un nom…">
      <button class="btn small" id="nav-go" style="width:auto;">Aller</button>
    </div>
    <div class="quick-links" id="quick-links"></div>
  `;
  const links = [
    {label:'Google', ic:'🔎', url:'https://www.google.com'},
    {label:'WhatsApp', ic:'💬', url:'https://web.whatsapp.com'},
    {label:'YouTube', ic:'▶️', url:'https://www.youtube.com'},
    {label:'Facebook', ic:'📘', url:'https://www.facebook.com'},
    {label:'Gmail', ic:'✉️', url:'https://mail.google.com'},
    {label:'Maps', ic:'🗺️', url:'https://maps.google.com'},
  ];
  const row = document.getElementById('quick-links');
  links.forEach(l=>{
    const d = document.createElement('div'); d.className='qlink';
    d.innerHTML = `<span class="ic">${l.ic}</span>${l.label}`;
    d.onclick = ()=>window.open(l.url, '_blank');
    row.appendChild(d);
  });
  const go = ()=>{
    let q = document.getElementById('nav-input').value.trim();
    if(!q) return;
    let url;
    if(/^https?:\/\//i.test(q)) url = q;
    else if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)) url = 'https://' + q;
    else url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    window.open(url, '_blank');
  };
  document.getElementById('nav-go').onclick = go;
  document.getElementById('nav-input').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ---------------- STOCKAGE (indépendant par appareil) ---------------- */
async function renderStorage(el){
  const totalSize = state.media.reduce((a,m)=>a+(m.size||0),0);
  el.innerHTML = `
    <div class="section-title"><h2>💾 Stockage</h2></div>
    <div class="tag-note">
      Cette application est <b>indépendante sur chaque appareil</b> : les fichiers que vous ajoutez restent
      enregistrés uniquement dans ce navigateur, sur cet appareil. Rien n'est envoyé sur internet ni partagé
      automatiquement avec un autre téléphone ou ordinateur.
      <br><br>
      Pour faire passer un fichier vers un autre appareil : ouvrez-le, touchez « Enregistrer sur cet appareil »,
      puis envoyez-le vous-même (WhatsApp, e-mail, câble, clé USB…) — ou ajoutez-le directement depuis
      l'application sur l'autre appareil.
      <br><br>
      ⚠️ Si vous videz les données du navigateur ou désinstallez l'application, ces fichiers seront perdus :
      gardez toujours une copie des documents importants ailleurs.
    </div>
    <div class="sync-item"><div class="dot"></div><div><b>${state.media.length}</b> fichier(s) stocké(s) sur cet appareil · ${formatSize(totalSize)}</div></div>
    <div id="quota-info"></div>
    <button class="btn danger small" id="wipe-btn" style="margin-top:14px;">🗑️ Vider le stockage de cet appareil</button>
  `;
  document.getElementById('wipe-btn').onclick = confirmWipe;
  if(navigator.storage && navigator.storage.estimate){
    try{
      const est = await navigator.storage.estimate();
      const q = document.getElementById('quota-info');
      if(q) q.innerHTML = `<div class="sync-item"><div class="dot"></div><div>Espace navigateur utilisé : ${formatSize(est.usage)} / ${formatSize(est.quota)} disponibles</div></div>`;
    }catch(e){}
  }
}

function setStatus(id, msg){ const s = document.getElementById('status-'+id); if(s) s.textContent = msg; }

async function saveBlob(filename, blob){
  if(claudeDownloads){
    const arr = new Uint8Array(await blob.arrayBuffer());
    let bin=''; arr.forEach(b=>bin+=String.fromCharCode(b));
    await claudeDownloads.save({filename, data:btoa(bin)});
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
}

async function convertImagesToPdf(files){
  if(!files || !files.length) return;
  setStatus('img2pdf', 'Conversion…');
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    for(let i=0;i<files.length;i++){
      const img = await loadImage(await fileToDataUrl(files[i]));
      const k = Math.min(1, 2400/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      const jpg = cv.toDataURL('image/jpeg', 0.92);
      const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
      const ratio = Math.min(w/cv.width, h/cv.height);
      const iw = cv.width*ratio, ih = cv.height*ratio;
      if(i>0) pdf.addPage();
      pdf.addImage(jpg, 'JPEG', (w-iw)/2, (h-ih)/2, iw, ih);
    }
    await saveBlob('images-converties.pdf', pdf.output('blob'));
    setStatus('img2pdf', 'Terminé ✅');
  }catch(e){ console.error(e); setStatus('img2pdf', "Échec de la conversion (image illisible ?)"); }
}

async function convertPdfToImages(file){
  if(!file) return;
  setStatus('pdf2img', 'Conversion…');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data:buf}).promise;
    for(let p=1;p<=doc.numPages;p++){
      const page = await doc.getPage(p);
      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
      const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
      await saveBlob(file.name.replace(/\.pdf$/i,'') + '-page' + p + '.png', blob);
    }
    setStatus('pdf2img', 'Terminé ✅ (' + doc.numPages + ' page(s))');
  }catch(e){ console.error(e); setStatus('pdf2img', "Échec de la conversion"); }
}

/* ---- PDF → Word (.docx) : récupère le texte et la structure de base ---- */
async function pdfDocToDocxBlob(doc){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const pages = [], sizes = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i=>typeof i.str==='string' && i.str.length>0)
      .map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], h:Math.abs(i.transform[3])||i.height||10, w:i.width||0}));
    items.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
    const lines = [];
    for(const it of items){
      const last = lines[lines.length-1];
      if(last && Math.abs(last.y-it.y) <= Math.max(2, it.h*0.5)) last.items.push(it);
      else lines.push({y:it.y, items:[it]});
    }
    const out = lines.map(L=>{
      L.items.sort((a,b)=>a.x-b.x);
      let text='', prevEnd=null, h=0;
      for(const it of L.items){
        if(prevEnd!==null && it.x-prevEnd > it.h*0.25 && !text.endsWith(' ') && !it.s.startsWith(' ')) text+=' ';
        text += it.s; prevEnd = it.x+it.w; h = Math.max(h, it.h);
      }
      return {y:L.y, h, text:text.replace(/\s+$/,'')};
    }).filter(l=>l.text.trim()!=='');
    out.forEach(l=>sizes.push(l.h));
    pages.push(out);
  }
  if(!sizes.length) return null;
  sizes.sort((a,b)=>a-b);
  const median = sizes[Math.floor(sizes.length/2)];
  let body = '';
  pages.forEach((lines,pi)=>{
    const maxLen = Math.max(1, ...lines.map(l=>l.text.length));
    const paras = []; let cur = null;
    lines.forEach((l,i)=>{
      const prev = lines[i-1];
      const heading = l.h > median*1.25;
      const startNew = !cur || heading || cur.heading || (prev && ((prev.y-l.y) > prev.h*1.6 || prev.text.length < maxLen*0.6));
      if(startNew){ cur = {heading, h:l.h, text:l.text}; paras.push(cur); }
      else cur.text += ' ' + l.text;
    });
    paras.forEach((pa,k)=>{
      const rpr = pa.heading ? `<w:rPr><w:b/><w:sz w:val="${Math.min(56,Math.max(26,Math.round(pa.h*2)))}"/></w:rPr>` : '';
      const pb = (pi>0 && k===0) ? '<w:pageBreakBefore/>' : '';
      body += `<w:p><w:pPr>${pb}<w:spacing w:after="120"/></w:pPr><w:r>${rpr}<w:t xml:space="preserve">${esc(pa.text)}</w:t></w:r></w:p>`;
    });
  });
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', head+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file('_rels/.rels', head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/_rels/document.xml.rels', head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.file('word/styles.xml', head+`<w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`);
  zip.file('word/document.xml', head+`<w:document xmlns:w="${W}"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

async function convertPdfToDocx(file){
  if(!file) return;
  setStatus('pdf2docx', 'Conversion…');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data:buf}).promise;
    const blob = await pdfDocToDocxBlob(doc);
    if(!blob){ setStatus('pdf2docx', "Aucun texte trouvé : ce PDF est une image scannée, il ne peut pas être converti en Word modifiable."); return; }
    await saveBlob(file.name.replace(/\.pdf$/i,'') + '.docx', blob);
    setStatus('pdf2docx', 'Terminé ✅ — vérifiez la mise en page dans Word');
  }catch(e){ console.error(e); setStatus('pdf2docx', "Échec de la conversion (PDF protégé ou endommagé ?)"); }
}

async function convertDocxToPdf(file){
  if(!file) return;
  setStatus('docx2pdf', 'Conversion…');
  let wrapper = null;
  try{
    if(typeof html2canvas === 'undefined') throw new Error('html2canvas manquant (connexion internet requise)');
    const buf = await file.arrayBuffer();
    const res = await mammoth.convertToHtml({arrayBuffer:buf});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    wrapper = document.createElement('div');
    wrapper.style.cssText = 'width:515px;background:#fff;color:#111;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;';
    wrapper.innerHTML = '<style>p{margin:0 0 8px}h1,h2,h3{margin:14px 0 8px}img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px}</style>' + res.value;
    await pdf.html(wrapper, { margin:[40,40,40,40], autoPaging:'text', x:0, y:0, width:515, windowWidth:515 });
    await saveBlob(file.name.replace(/\.docx$/i,'') + '.pdf', pdf.output('blob'));
    setStatus('docx2pdf', 'Terminé ✅');
  }catch(e){
    console.error(e);
    setStatus('docx2pdf', navigator.onLine ? "Échec de la conversion (fichier .docx illisible ou trop complexe)" : "Connexion internet requise pour cette conversion.");
  }finally{
    if(wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
  }
}

async function convertImageToIcon(file){
  if(!file) return;
  setStatus('img2icon', 'Conversion…');
  try{
    const dataUrl = await fileToDataUrl(file);
    const img = await loadImage(dataUrl);
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const side = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0,0,size,size);
    const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
    await saveBlob(file.name.replace(/\.[^.]+$/,'') + '-icone-512.png', blob);
    setStatus('img2icon', 'Terminé ✅');
  }catch(e){ console.error(e); setStatus('img2icon', "Échec de la conversion"); }
}

function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result); r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise((res,rej)=>{
    const img = new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=src;
  });
}

/* ---------------- Modal ---------------- */
function openModal(html, viewer){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg ${viewer?'viewer-modal':''}" id="modal-bg"><div class="modal">${html}</div></div>`;
  document.getElementById('modal-bg').onclick = (e)=>{ if(e.target.id==='modal-bg') closeModal(); };
}
function closeModal(){
  const v = document.getElementById('viewer-video');
  if(v){
    try{ if(document.pictureInPictureElement===v) document.exitPictureInPicture(); }catch(e){}
    videoState = {queue:[], idx:0, cur:null};
    if(mediaKind==='video') clearMediaSession();
  }
  document.getElementById('modal-root').innerHTML = '';
}

async function triggerInstall(){
  if(!deferredInstallPrompt){
    toast("Votre navigateur ne propose pas encore l'installation ici (déjà installée, ou navigateur non compatible).");
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.querySelectorAll('.install-btn').forEach(b=>b.classList.add('hidden'));
}

/* ---------------- Utils ---------------- */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatSize(b){ if(!b) return '0 Ko'; const u=['o','Ko','Mo','Go']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(1)+' '+u[i]; }
function formatDate(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
</script>
